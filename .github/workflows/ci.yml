name: ft_irc CI

on:
  push:
    branches:
      - main
      - feat/mode-command
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build C++98 project
        run: |
          make fclean
          make
          make

      - name: Run integration suite
        run: python3 tests/irc_test.py

      - name: Check poll/send/recv locations
        run: |
          test "$(grep -R --include='*.cpp' -n 'poll(' src | wc -l)" -eq 1
          test "$(grep -R --include='*.cpp' -n 'send(' src | wc -l)" -eq 1
          test "$(grep -R --include='*.cpp' -n 'recv(' src | wc -l)" -eq 1
